[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendockit"
version = "0.1.0"
description = "Convert PDF, Office, HWP/HWPX, HTML, email, spreadsheets and images into clean, LLM-ready Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "OpenDocKit contributors" }]
keywords = ["markdown", "pdf", "docx", "pptx", "xlsx", "hwp", "hwpx", "llm", "rag", "document-conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    "lxml>=5.2",
    "olefile>=0.47",
    "openpyxl>=3.1",
    "pdfminer.six>=20240706",
    "pdfplumber>=0.11",
    "pillow>=11.3",  # 11.3 is the first release that reads AVIF
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
# HEIC/HEIF images. Kept out of the default install because the pillow-heif wheels bundle GPLv2 (x265) and LGPLv3
# (libheif, libde265) libraries; everything installed by default is permissively licensed.
heic = [
    "pillow-heif>=0.16",
]
# Vision model support (`OpenAIImageDescriber`, `opendockit --describe`).
openai = [
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
]

[project.scripts]
opendockit = "opendockit.cli:main"

[project.urls]
Homepage = "https://github.com/hyeonsang010716/OpenDocKit"
Documentation = "https://github.com/hyeonsang010716/OpenDocKit/tree/main/docs"
Issues = "https://github.com/hyeonsang010716/OpenDocKit/issues"
Changelog = "https://github.com/hyeonsang010716/OpenDocKit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "opendockit[heic,openai]",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opendockit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "timing: asserts on wall-clock time or real timeouts; CI runs these serially (`-m timing`) so load from parallel workers cannot fail them",
]

[tool.ruff]
line-length = 150
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "C4", "PIE", "RUF100"]
ignore = [
    "B007",  # loop variables are read after the loop on purpose
    "B023",  # lambdas passed to re.sub are called before the loop moves on
]

[tool.ruff.lint.per-file-ignores]
# Long lines in tests are sample documents; East Asian characters also count double.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
known-first-party = ["opendockit", "tests"]
