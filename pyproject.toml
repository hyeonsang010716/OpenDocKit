[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendockit"
version = "0.3.16"
description = "Convert PDF, Office, HWP/HWPX, OpenDocument, RTF, EPUB, HTML, email and images into clean, LLM-ready Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "OpenDocKit contributors" }]
keywords = ["markdown", "pdf", "docx", "pptx", "xlsx", "hwp", "hwpx", "odt", "ods", "odp", "opendocument", "rtf", "epub", "doc", "ppt", "html", "email", "llm", "rag", "langchain", "llama-index", "mcp", "open-webui", "document-conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
# Every lower bound below is the oldest version the full test suite was run against (one package at a time and all together).
dependencies = [
    "beautifulsoup4>=4.13,!=4.14.0",  # 4.14.0 mis-parses some documents; fixed in 4.14.1
    "charset-normalizer>=3.5",
    # Only where lxml bundles libxml2 older than 2.14, which is its Windows wheels: the HTML extractor builds its
    # tree with html5lib there, so that malformed and multi-part pages do not lose content (docs/decisions/html.md).
    "html5lib>=1.1; sys_platform == 'win32'",
    "lxml>=6.0",  # the HTML extractor relies on the HTML5 tokenizer of libxml2 2.14, first bundled in lxml 6.0
    "olefile>=0.47",
    "openpyxl>=3.1.4",
    "pdfminer.six>=20251230",
    "pdfplumber>=0.11.9",
    "pillow>=11.3",  # 11.3 is the first release that reads AVIF
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
# HEIC/HEIF images. Kept out of the default install because the pillow-heif wheels bundle GPLv2 (x265) and LGPLv3
# (libheif, libde265) libraries; everything installed by default is permissively licensed.
heic = [
    "pillow-heif>=0.16",
]
# Vision model support (`OpenAIImageDescriber`, `opendockit --describe`).
openai = [
    "httpx>=0.27",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
]

# Adapters for other frameworks (`opendockit.integrations`). None of them is needed to convert documents.
langchain = [
    "langchain-core>=1.0",
]
llamaindex = [
    "llama-index-core>=0.14",
]
# The `opendockit` parser engine of LightRAG. 1.5.8 is the release its contract was read from and is tested against.
lightrag = [
    "lightrag-hku>=1.5.8",
]
# The `opendockit-mcp` server. 2.0 renamed the server class the module is written against.
mcp = [
    "mcp>=2.0",
]
# The `opendockit-open-webui` document loader. The lower bounds are those of the MCP SDK's own range, so the oldest versions
# the suite runs against are the ones declared.
open-webui = [
    "starlette>=0.49.1",
    "uvicorn>=0.31.1",
]

[project.scripts]
opendockit = "opendockit.cli:main"
opendockit-mcp = "opendockit.mcp_server:main"
opendockit-open-webui = "opendockit.open_webui:main"

# LightRAG calls this when it starts and finds OpenDocKit installed (`opendockit.integrations.lightrag`).
[project.entry-points."lightrag.parsers"]
opendockit = "opendockit.integrations.lightrag:register"

[project.urls]
Homepage = "https://github.com/hyeonsang010716/OpenDocKit"
Documentation = "https://github.com/hyeonsang010716/OpenDocKit/tree/main/docs"
Issues = "https://github.com/hyeonsang010716/OpenDocKit/issues"
Changelog = "https://github.com/hyeonsang010716/OpenDocKit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "opendockit[heic,openai,langchain,llamaindex,lightrag,mcp,open-webui]",
    "cryptography>=46.0.3",  # tests/pdf_encryption.py writes AES; the newest release Windows on Arm has a wheel of, so the minimum-dependencies job reads PDFs with it
    "gevent>=26.9",  # the Dify plugin's runtime serves requests with it (tests/test_dify_plugin.py)
    "pytest>=8.3",
    "pytest-rerunfailures>=16.6",  # reruns a failed timing test (tests/conftest.py); MPL-2.0, development only
    "pytest-xdist>=3.6",
    "reportlab>=4.2",
    "ruff>=0.8",
    "rapidfuzz>=3.9",  # the scorecard's edit distances on long documents (evals/metrics.py, which also runs without it); MIT, development only
]

[tool.hatch.build.targets.wheel]
packages = ["src/opendockit"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/hermes-plugin", "/claude-plugin", "/.claude-plugin", "/dify-plugin", "/packages", "/README.md", "/CHANGELOG.md", "/LICENSE"]
# The demo animations are for the README on GitHub; they would add 7 MB to every source distribution.
exclude = ["/docs/assets/*.gif", "/packages/*/target"]  # the native reader's build folder

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-raR --strict-markers --strict-config"  # R: list the timing tests that were run again (tests/conftest.py)
xfail_strict = true
markers = [
    "live: calls a real vision model; skipped unless OPENDOCKIT_LIVE_TESTS=1 and OPENAI_API_KEY are set",
    "timing: asserts on wall-clock time or real timeouts; CI runs these serially (`-m timing`) so load from parallel workers cannot fail them, and a failed one is run again up to twice, at most 10 reruns a session (tests/conftest.py)",
    "no_rerun: a timing test that starts processes or threads and checks how they end; a failed one is never run again, as the failure can be a real race",
]

[tool.ruff]
line-length = 150
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["benchmarks/cases", "benchmarks/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "C4", "PIE", "RUF100"]
ignore = [
    "B007",  # loop variables are read after the loop on purpose
    "B023",  # lambdas passed to re.sub are called before the loop moves on
]

[tool.ruff.lint.per-file-ignores]
# Long lines in tests are sample documents; East Asian characters also count double.
"tests/*" = ["E501"]
"examples/*" = ["E501"]
"benchmarks/*" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
known-first-party = ["opendockit", "tests", "evals"]
