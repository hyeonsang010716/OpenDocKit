name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check

  test:
    timeout-minutes: 20
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is not verified yet: its result is reported but does not fail the workflow.
    # Remove `experimental` (and add the Windows classifier in pyproject.toml) once it is green.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      # The .doc / .ppt tests that start a real LibreOffice run only where it is installed: one Linux job is enough.
      - name: Install LibreOffice
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-impress
      - name: Tests (parallel)
        run: uv run pytest -n auto -m "not timing"
      # Tests that assert on wall-clock time run on their own, one at a time, so busy workers cannot fail them.
      - name: Timing tests (serial)
        if: ${{ !cancelled() }}
        run: uv run pytest -m timing --durations=15

  minimum-dependencies:
    timeout-minutes: 20
    # Runs the suite against the oldest versions allowed by pyproject.toml, so the declared lower bounds stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --python 3.12 --resolution lowest-direct
      - run: uv run --no-sync pytest -n auto -m "not timing"
      - run: uv run --no-sync pytest -m timing

  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Install the wheel without extras and import it
        run: |
          uv venv --python 3.12 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import opendockit; print(opendockit.__version__)"
          /tmp/wheel-env/bin/opendockit --help
      - name: Build the launcher and start the server from the two wheels
        run: |
          uv build packages/opendockit-mcp --out-dir dist-mcp
          uv venv --python 3.12 /tmp/launcher-env
          uv pip install --python /tmp/launcher-env --find-links dist dist-mcp/*.whl
          /tmp/launcher-env/bin/opendockit-mcp --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | /tmp/launcher-env/bin/opendockit-mcp | grep -q '"name":"opendockit"'

  # The entry the release publishes to the MCP Registry, checked with the registry's own tool before anything is released.
  registry-entry:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher validate packages/opendockit-mcp/server.json
