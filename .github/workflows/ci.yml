name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check

  test:
    # The timing tests run one at a time and take most of the job; 20 minutes was nearly used up (about 15 in November 2026)
    timeout-minutes: 40
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          # Windows runs on the oldest and the newest version. Its own code (the job object of `IsolatedConverter`, the
          # LibreOffice job, html5lib as the tree builder) is the same on each, but the worker pool it drives reaches into
          # private parts of `concurrent.futures` that a new Python may change; 3.13 in between is left to the other systems.
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      # The .doc / .ppt tests that start a real LibreOffice run only where it is installed: one Linux job, and one Windows
      # job, whose way of ending LibreOffice (a job object), removing its folder and finding the program (the registry,
      # for an MCP server started without PROGRAMFILES) is its own and is only proven against the real program.
      - name: Install LibreOffice
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-impress
      - name: Install LibreOffice (Windows)
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        run: choco install libreoffice-fresh --no-progress -y
      - name: Tests (parallel)
        run: uv run pytest -n auto -m "not timing"
      # Tests that assert on wall-clock time run on their own, one at a time, so busy workers cannot fail them.
      - name: Timing tests (serial)
        if: ${{ !cancelled() }}
        run: uv run pytest -m timing --durations=15

  native:
    # The native sheet reader (packages/opendockit-xlsx-core): built from source and installed, the whole suite is run
    # with it, so every test compares its rows with the Python readers' (tests/test_spreadsheet_quick_rows.py).
    timeout-minutes: 40
    name: native reader (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint the native reader
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          cargo fmt --manifest-path packages/opendockit-xlsx-core/Cargo.toml --check
          cargo clippy --manifest-path packages/opendockit-xlsx-core/Cargo.toml --release -- -D warnings
      - name: Build and install the native reader
        shell: bash
        run: |
          python="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          uvx maturin build --release --manifest-path packages/opendockit-xlsx-core/Cargo.toml --interpreter "$python" --out native-dist
          uv pip install native-dist/*.whl
      - run: uv run --no-sync python -c "import opendockit_xlsx_core"
      - name: Tests (parallel)
        run: uv run --no-sync pytest -n auto -m "not timing"

  minimum-dependencies:
    timeout-minutes: 40
    # Runs the suite against the oldest versions allowed by pyproject.toml, so the declared lower bounds stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --python 3.12 --resolution lowest-direct
      - run: uv run --no-sync pytest -n auto -m "not timing"
      - run: uv run --no-sync pytest -m timing

  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Install the wheel without extras and import it
        run: |
          uv venv --python 3.12 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import opendockit; print(opendockit.__version__)"
          /tmp/wheel-env/bin/opendockit --help
          /tmp/wheel-env/bin/opendockit-open-webui --version
      - name: Build the launcher and start the server from the two wheels
        run: |
          uv build packages/opendockit-mcp --out-dir dist-mcp
          uv venv --python 3.12 /tmp/launcher-env
          uv pip install --python /tmp/launcher-env --find-links dist dist-mcp/*.whl
          /tmp/launcher-env/bin/opendockit-mcp --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | /tmp/launcher-env/bin/opendockit-mcp | grep -q '"name":"opendockit"'

  # The entry the release publishes to the MCP Registry, checked with the registry's own tool before anything is released.
  registry-entry:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher validate packages/opendockit-mcp/server.json
